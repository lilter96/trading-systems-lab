name: Offline and disposable database verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trading_engine
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test trading-node/engine-net/SMC.Engine.slnx -c Release
        env:
          TRADING_TEST_POSTGRES: Host=127.0.0.1;Database=trading_engine;Username=postgres;Password=postgres
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: watchdog-go/go.mod
          cache-dependency-path: watchdog-go/go.sum
      - run: go test ./...
        working-directory: watchdog-go
