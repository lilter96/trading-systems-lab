syntax = "proto3";

package common;

option go_package = "trading-system/contracts/go/commonpb";

service EmergencyService {
  rpc HaltSystem(HaltRequest) returns (HaltResponse);
}

message HaltRequest {
  string reason = 1;
  int64 timestamp = 2;
  string triggered_by = 3;
}

message HaltResponse {
  bool success = 1;
  string error_message = 2;
}

message Heartbeat {
  string service_name = 1;
  string status = 2;
  int64 epoch_timestamp = 3;
}

message HaltCommand {
  string reason = 1;
  string issued_by = 2;
  int64 timestamp = 3;
}

message CommandAck {
  string command_id = 1;
  string status = 2;
  string message = 3;
  int64 timestamp = 4;
}
